<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="dashboard-grid">

    <!-- ───────────── GREETING ───────────── -->
    <section class="card" id="greeting-card">
      <div class="greeting-header">
        <p id="greeting-text">Good Morning</p>
        <button id="theme-toggle" aria-label="Switch to dark mode">🌙</button>
      </div>
      <p id="clock" class="clock">00:00:00</p>
      <p id="date-text" class="date-text">Monday, 1 January 2025</p>

      <!-- Name editor -->
      <div class="name-row">
        <span id="name-display" class="name-display"></span>
        <button id="name-edit-btn" class="btn-icon" aria-label="Edit name">✏️</button>
      </div>
      <div class="name-editor" hidden>
        <input id="name-input" class="text-input" type="text" placeholder="Your name…" maxlength="50"
          autocomplete="off" />
        <button id="name-save-btn" class="btn btn-primary" aria-label="Save name">✓</button>
        <button id="name-cancel-btn" class="btn btn-ghost" aria-label="Cancel">✕</button>
      </div>
    </section>

    <!-- ───────────── FOCUS TIMER ───────────── -->
    <section class="card" id="timer-card">
      <h2 class="card-title">Focus Timer</h2>
      <p id="timer-display" class="timer-display">25:00</p>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop" class="btn btn-secondary">Stop</button>
        <button id="timer-reset" class="btn btn-ghost">Reset</button>
      </div>

      <!-- Custom duration -->
      <div class="timer-settings">
        <label for="timer-duration-input">Duration (min)</label>
        <input id="timer-duration-input" type="number" min="1" max="60" placeholder="25" />
        <button id="timer-duration-set" class="btn btn-secondary">Set</button>
      </div>
      <p id="timer-duration-error" class="error-msg" aria-live="polite"></p>
    </section>

    <!-- ───────────── TO-DO LIST ───────────── -->
    <section class="card" id="todo-card">
      <h2 class="card-title">To-Do List</h2>
      <form id="todo-form" class="input-row" novalidate>
        <input id="todo-input" class="text-input" type="text" placeholder="Add a new task…" maxlength="200"
          autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <p id="todo-error" class="error-msg" aria-live="polite"></p>

      <!-- Sort controls -->
      <div class="todo-controls">
        <label for="todo-sort">Sort:</label>
        <select id="todo-sort" aria-label="Sort tasks">
          <option value="default">Default</option>
          <option value="az">A–Z</option>
          <option value="za">Z–A</option>
          <option value="completed-last">Completed Last</option>
        </select>
      </div>

      <ul id="todo-list" class="task-list" aria-label="Task list"></ul>
    </section>

    <!-- ───────────── QUICK LINKS ───────────── -->
    <section class="card" id="links-card">
      <h2 class="card-title">Quick Links</h2>
      <form id="link-form" class="input-row link-form" novalidate>
        <input id="link-label" class="text-input" type="text" placeholder="Label (e.g. GitHub)" maxlength="50"
          autocomplete="off" />
        <input id="link-url" class="text-input" type="url" placeholder="https://example.com" maxlength="500"
          autocomplete="off" />
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
      <p id="link-error" class="error-msg" aria-live="polite"></p>
      <div id="links-grid" class="links-grid" aria-label="Quick links"></div>
    </section>

  </div><!-- /.dashboard-grid -->

  <script src="js/app.js"></script>
</body>

</html>
